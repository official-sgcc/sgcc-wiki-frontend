name: Frontend CI

on:
  push:
    branches: [main, ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SERVER_URL: /api

      - name: Verify production bundle
        run: |
          test -f dist/index.html
          if grep -R -F "http://localhost:8000" dist; then
            echo "Production bundle contains the local API URL."
            exit 1
          fi

      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  aws-build:
    name: Build AWS production bundle
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare AWS production environment
        shell: bash
        env:
          FRONTEND_ENV_PRODUCTION: ${{ secrets.FRONTEND_ENV_PRODUCTION }}
        run: |
          if [ -z "$FRONTEND_ENV_PRODUCTION" ]; then
            echo "FRONTEND_ENV_PRODUCTION is not configured."
            exit 1
          fi

          printf '%s\n' "$FRONTEND_ENV_PRODUCTION" > .env.production

          node --input-type=module <<'NODE'
          import { loadEnv } from 'vite';

          const apiBaseUrl = loadEnv('production', process.cwd(), '').VITE_API_BASE_URL;

          if (!apiBaseUrl) {
            console.error('VITE_API_BASE_URL is missing from FRONTEND_ENV_PRODUCTION.');
            process.exit(1);
          }

          let parsedUrl;

          try {
            parsedUrl = new URL(apiBaseUrl);
          } catch {
            console.error('VITE_API_BASE_URL is not a valid absolute URL.');
            process.exit(1);
          }

          if (
            parsedUrl.protocol !== 'https:' ||
            parsedUrl.username ||
            parsedUrl.password ||
            parsedUrl.search ||
            parsedUrl.hash ||
            ['localhost', '127.0.0.1'].includes(parsedUrl.hostname)
          ) {
            console.error('VITE_API_BASE_URL must be a production HTTPS URL.');
            process.exit(1);
          }
          NODE

      - name: Build AWS production bundle
        run: npm run build

      - name: Verify AWS production bundle
        run: |
          test -f dist/index.html
          if grep -R -E "https?://(localhost|127\\.0\\.0\\.1)(:|/)" dist; then
            echo "AWS production bundle contains a local URL."
            exit 1
          fi

          api_base_url="$(
            node --input-type=module -e \
              "import { loadEnv } from 'vite'; process.stdout.write(loadEnv('production', process.cwd(), '').VITE_API_BASE_URL);"
          )"

          if ! grep -R -F -q -- "$api_base_url" dist; then
            echo "AWS production bundle does not contain VITE_API_BASE_URL."
            exit 1
          fi

      - name: Upload AWS production bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-aws-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  image:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download production bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push frontend image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/nginx/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
  deploy:
    name: Deploy to S3 + CloudFront
    needs: aws-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: aws-frontend-production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download production bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-aws-${{ github.sha }}
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "567886497655"

      - name: Deploy versioned assets to S3
        run: |
          aws s3 sync dist/assets/ "s3://${{ vars.S3_BUCKET }}/assets/" \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

      - name: Deploy other static files to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --only-show-errors

      - name: Deploy index to S3
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache,max-age=0,must-revalidate" \
            --only-show-errors

      - name: Invalidate and wait for CloudFront
        shell: bash
        run: |
          invalidation_id="$(
            aws cloudfront create-invalidation \
              --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
              --paths "/*" \
              --query "Invalidation.Id" \
              --output text
          )"

          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$invalidation_id"

      - name: Verify deployed frontend
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            "https://${{ vars.CLOUDFRONT_DOMAIN }}/" \
            --output deployed-index.html

          if ! cmp --silent dist/index.html deployed-index.html; then
            echo "CloudFront did not return the deployed index.html."
            exit 1
          fi
